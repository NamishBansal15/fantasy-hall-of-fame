<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Hall of Fame · League 143378511</title><style>
:root{--bg:#090d14;--panel:#121a27;--panel2:#192334;--line:#293345;--gold:#f2c66d;--muted:#93a0b3;--white:#f5f6f8;--green:#70d6a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,select,input{font:inherit}button{cursor:pointer}header{height:75px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1260px)/2));background:#0c111a}.brand{font-weight:900;letter-spacing:1.5px;font-size:19px}.brand span{color:var(--gold)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800;text-transform:uppercase}.tag{border:1px solid #5b4b2e;background:#292319;color:var(--gold);padding:7px 11px;border-radius:30px;font-size:12px}.layout{display:flex;max-width:1340px;margin:auto;min-height:calc(100vh - 75px)}aside{width:218px;border-right:1px solid var(--line);padding:27px 14px;flex-shrink:0}aside .section{font-size:10px;color:#657286;letter-spacing:2px;margin:0 13px 14px}nav button{display:block;width:100%;border:0;text-align:left;background:none;color:#a5b0c1;padding:13px 14px;border-radius:9px;margin:3px 0;font-weight:650}nav button.active,nav button:hover{background:#242b33;color:var(--gold)}main{flex:1;min-width:0;padding:38px 38px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{font-size:35px;letter-spacing:-1px;margin:6px 0 7px}.sub{color:var(--muted);margin:0 0 26px}.btn{background:var(--gold);color:#15140d;border:0;border-radius:8px;padding:11px 16px;font-weight:800}.btn.secondary{background:#202a39;color:#f0f2f5;border:1px solid #3a475a}.hero{background:radial-gradient(ellipse at 80% 30%,#55421e 0%,transparent 48%),linear-gradient(125deg,#20283a,#111823 65%);border:1px solid #4b422f;border-radius:17px;padding:29px 32px;display:flex;justify-content:space-between;align-items:center;margin-bottom:21px;min-height:190px}.hero h2{font-size:29px;max-width:490px;margin:10px 0}.hero p{color:#b9c1cc;max-width:500px;margin:0}.trophy{font-size:92px;filter:drop-shadow(0 10px 20px #0008);padding:0 35px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px}.stat label{color:var(--muted);font-size:12px;display:block}.stat strong{font-size:30px;display:block;margin:8px 0}.stat small{color:var(--gold);font-size:11px}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}.card h3{margin:0 0 19px;font-size:17px}.row{display:flex;align-items:center;gap:12px;border-top:1px solid #273244;padding:13px 0}.row:first-of-type{border-top:0}.rank{font-weight:800;color:var(--gold);width:25px}.avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#31425a;color:#dce8f5}.name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:3px}.right{margin-left:auto;text-align:right;font-weight:800}.gold{color:var(--gold)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.record{background:#151f2e;border:1px solid var(--line);border-radius:12px;padding:20px}.record .value{font-size:28px;font-weight:900;color:var(--gold);margin:11px 0}.record p{color:var(--muted);margin:0;font-size:12px}.pill{display:inline-block;padding:4px 9px;background:#2b3544;color:#c6d1df;border-radius:20px;font-size:11px}.empty{padding:30px;color:var(--muted);border:1px dashed #465268;border-radius:12px}.file{display:none}.import{padding:22px;border:1px dashed #6c603e;border-radius:14px;background:#181d23;margin-top:18px}.import p{color:var(--muted);line-height:1.6}.import code{color:var(--gold);overflow-wrap:anywhere}.notice{background:#222b35;color:#c6d0dc;border-left:3px solid var(--gold);padding:12px 15px;border-radius:5px;margin:16px 0;font-size:13px}.filter{background:#192334;color:#fff;border:1px solid #3b4758;border-radius:8px;padding:10px}.bars{display:flex;align-items:end;gap:10px;height:140px;padding-top:10px}.barwrap{flex:1;text-align:center;font-size:11px;color:var(--muted)}.bar{background:linear-gradient(var(--gold),#9a6c25);border-radius:5px 5px 0 0;margin:0 auto 7px;width:65%;min-height:4px}.footer{font-size:12px;color:#6d798a;margin-top:45px}a{color:var(--gold)}@media(max-width:900px){aside{width:65px;padding:18px 7px}aside .section{display:none}nav button{font-size:0;padding:14px;text-align:center}nav button::first-letter{font-size:20px}main{padding:24px 17px}.stats{grid-template-columns:repeat(2,1fr)}.two,.grid3{grid-template-columns:1fr}.hero{padding:23px}.trophy{display:none}}@media(max-width:480px){header{padding:0 12px}.brand{font-size:14px}.top h1{font-size:27px}.stat strong{font-size:24px}}
</style></head><body><header><div class="brand">🏆 &nbsp;FANTASY <span>HALL OF FAME</span></div><div class="tag" id="modeTag">● DEMO MODE</div></header><div class="layout"><aside><p class="section">LEAGUE OFFICE</p><nav id="nav"></nav></aside><main><div class="top"><div><div class="eyebrow">ESPN FANTASY FOOTBALL · #143378511</div><h1 id="pageTitle">League Overview</h1></div><button class="btn secondary" onclick="setPage('import')">↥ Import data</button></div><p class="sub" id="pageSub">Your league's legacy, all in one place.</p><div id="content"></div><div class="footer">Independent fan-made league dashboard · Not affiliated with ESPN · Sample stats are fictional until real data is imported.</div></main></div><input id="upload" class="file" type="file" accept=".json,application/json" multiple><script>
const LEAGUE_ID=143378511;const navs=[['overview','◈ Overview'],['hall','🏆 Hall of Fame'],['managers','♟ Managers'],['records','★ Record Book'],['rivalries','⚔ Rivalries'],['seasons','▤ Seasons'],['import','↥ Import ESPN']];let page='overview',season='all';const sampleNames=['Fourth & Long','Gridiron Kings','Sunday Scaries','The Waiver Wire','Red Zone Raiders','Bench Mob','Hail Mary Heroes','Touchdown Town'];const demo={demo:true,leagueName:'Your Fantasy League',seasons:[2023,2024,2025].map((year,yi)=>({year,teams:sampleNames.map((name,i)=>({id:i+1,managerId:'demo-'+(i+1),name,manager:name,rank:((i+yi*3)%8)+1,wins:Math.max(2,12-((i*3+yi*2)%10)),losses:((i*3+yi*2)%10)+2,points:Math.round(1280+((i*71+yi*119)%540))})),matchups:[]}))};let data=load()||demo;function load(){try{return JSON.parse(localStorage.getItem('fantasyHOFdata'))}catch(e){return null}}function save(){try{localStorage.setItem('fantasyHOFdata',JSON.stringify(data))}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function allTeams(){return data.seasons.flatMap(s=>s.teams.map(t=>({...t,year:s.year})))}function managers(){const m=new Map();for(const t of allTeams()){let k=t.managerId||t.name;if(!m.has(k))m.set(k,{id:k,name:t.manager||t.name,teams:[],titles:0,wins:0,losses:0,points:0,appearances:0});let v=m.get(k);v.teams.push(t);v.appearances++;v.titles+=t.rank===1?1:0;v.wins+=t.wins||0;v.losses+=t.losses||0;v.points+=t.points||0}return [...m.values()].sort((a,b)=>b.titles-a.titles||b.wins-a.wins)}function champions(){return data.seasons.map(s=>({year:s.year,team:s.teams.find(t=>t.rank===1)})).filter(x=>x.team).sort((a,b)=>b.year-a.year)}function stat(label,value,detail){return `<div class="stat"><label>${label}</label><strong>${esc(value)}</strong><small>${esc(detail)}</small></div>`}function managerRow(m,i){return `<div class="row"><span class="rank">${i+1}</span><span class="avatar">${esc(m.name.slice(0,2).toUpperCase())}</span><div><div class="name">${esc(m.name)}</div><div class="meta">${m.appearances} seasons · ${m.wins}-${m.losses} record</div></div><div class="right"><span class="gold">${m.titles} 🏆</span><div class="meta">${m.points.toLocaleString()} pts</div></div></div>`}function render(){document.getElementById('modeTag').textContent=data.demo?'● DEMO MODE':'● IMPORTED DATA';document.getElementById('nav').innerHTML=navs.map(([k,n])=>`<button class="${k===page?'active':''}" onclick="setPage('${k}')">${n}</button>`).join('');const titles={overview:'League Overview',hall:'Hall of Fame',managers:'Manager Rankings',records:'The Record Book',rivalries:'League Rivalries',seasons:'Season Archive',import:'Connect ESPN Data'};document.getElementById('pageTitle').textContent=titles[page];document.getElementById('pageSub').textContent=data.demo?'Preview with fictional league statistics · Import ESPN data to personalize.':`${data.leagueName} · ${data.seasons.length} imported season(s)`;const m=managers(),ch=champions(),teams=allTeams();let html='';if(page==='overview'){html=`<div class="hero"><div><div class="eyebrow">THE LEGACY LIVES HERE</div><h2>Every season. Every rivalry. Every legend.</h2><p>One place to settle the greatest debate in fantasy football: who's actually the GOAT?</p></div><div class="trophy">🏆</div></div><div class="stats">${stat('Seasons',data.seasons.length,'In the archive')}${stat('Managers',m.length,'Unique owner IDs')}${stat('Championships',ch.length,'Recorded winners')}${stat('Matchups',data.seasons.reduce((n,s)=>n+s.matchups.length,0),'Imported games')}</div><div class="two"><div class="card"><h3>👑 All-Time Leaderboard</h3>${m.slice(0,5).map(managerRow).join('')||'<div class="empty">No managers yet</div>'}</div><div class="card"><h3>🏆 Recent Champions</h3>${ch.slice(0,5).map(c=>`<div class="row"><span class="rank">${c.year}</span><span class="avatar">🏆</span><div><div class="name">${esc(c.team.name)}</div><div class="meta">${esc(c.team.manager||'League champion')}</div></div></div>`).join('')||'<div class="empty">No championship results yet</div>'}</div></div>`}if(page==='hall'){html=`<div class="hero"><div><div class="eyebrow">IMMORTALIZED IN LEAGUE HISTORY</div><h2>The Champions Club</h2><p>Every crowned champion, preserved for future generations of trash talk.</p></div><div class="trophy">🏆</div></div><div class="grid3">${ch.map(c=>`<div class="record"><div class="eyebrow">${c.year} CHAMPION</div><div class="value">🏆</div><div class="name">${esc(c.team.name)}</div><p>${esc(c.team.manager||'')} · ${c.team.wins}-${c.team.losses}</p></div>`).join('')||'<div class="empty">No champions available</div>'}</div>`}if(page==='managers'){html=`<div class="stats">${stat('Managers',m.length,'All-time')}${stat('Most titles',m[0]?.titles||0,m[0]?.name||'—')}${stat('Most wins',[...m].sort((a,b)=>b.wins-a.wins)[0]?.wins||0,'Career wins')}${stat('Seasons',data.seasons.length,'Tracked')}</div><div class="card"><h3>Career Rankings · Titles → Wins</h3>${m.map(managerRow).join('')}</div>`}if(page==='records'){const top=[...teams].sort((a,b)=>b.points-a.points)[0];const wins=[...m].sort((a,b)=>b.wins-a.wins)[0];const titles=m[0];const high=allGames().sort((a,b)=>b.score-a.score)[0];const narrow=allGames().filter(x=>x.margin>0).sort((a,b)=>a.margin-b.margin)[0];const cards=[['Most Championships',titles?.titles,titles?.name],['Most Career Wins',wins?.wins,wins?.name],['Highest Season Points',top?.points,top?`${top.name} · ${top.year}`:null],['Highest Single-Game Score',high?.score,high?`${high.name} · ${high.year} W${high.week}`:null],['Closest Matchup',narrow?.margin?.toFixed(2),narrow?`${narrow.year} · Week ${narrow.week}`:null],['Total Games',data.seasons.reduce((n,s)=>n+s.matchups.length,0),'All imported seasons']];html=`<div class="grid3">${cards.map(([name,val,desc])=>`<div class="record"><div class="eyebrow">${name}</div><div class="value">${val??'—'}</div><p>${esc(desc||'Not enough data')}</p></div>`).join('')}</div>`}if(page==='rivalries'){const pairs=new Map();for(const s of data.seasons)for(const g of s.matchups){const a=s.teams.find(t=>t.id===g.homeId),b=s.teams.find(t=>t.id===g.awayId);if(!a||!b)continue;const ak=a.managerId||a.name,bk=b.managerId||b.name,k=[ak,bk].sort().join('|');if(!pairs.has(k))pairs.set(k,{a:a.manager||a.name,b:b.manager||b.name,games:0,margin:0});const p=pairs.get(k);p.games++;p.margin+=Math.abs(g.homeScore-g.awayScore)}const arr=[...pairs.values()].sort((a,b)=>b.games-a.games);html=arr.length?`<div class="grid3">${arr.slice(0,18).map(p=>`<div class="record"><div class="eyebrow">${p.games} HEAD-TO-HEAD GAMES</div><div class="value" style="font-size:18px">${esc(p.a)} <span style="color:#8794a7">VS</span> ${esc(p.b)}</div><p>Average margin ${(p.margin/p.games).toFixed(1)} points</p></div>`).join('')}</div>`:`<div class="empty">No matchup history in ${data.demo?'the demo':'your imported seasons'} yet. Import ESPN data with <b>mMatchupScore</b> to unlock rivalries.</div>`}if(page==='seasons'){const years=[...data.seasons].sort((a,b)=>b.year-a.year);const selected=years.find(s=>String(s.year)===season)||years[0];html=`<div style="margin-bottom:17px"><select class="filter" onchange="season=this.value;render()">${years.map(s=>`<option ${s===selected?'selected':''}>${s.year}</option>`).join('')}</select></div>${selected?`<div class="stats">${stat('Season',selected.year,'Fantasy football')}${stat('Teams',selected.teams.length,'Participants')}${stat('Games',selected.matchups.length,'Recorded matchups')}${stat('Champion',selected.teams.find(t=>t.rank===1)?.name||'—','Season winner')}</div><div class="card"><h3>${selected.year} Final Standings</h3>${[...selected.teams].sort((a,b)=>a.rank-b.rank).map((t,i)=>`<div class="row"><span class="rank">${t.rank||i+1}</span><span class="avatar">${esc(t.name.slice(0,2))}</span><div><div class="name">${esc(t.name)}</div><div class="meta">${esc(t.manager||'')} · ${t.wins}-${t.losses}</div></div><div class="right">${Number(t.points).toLocaleString()} <span class="meta">PTS</span></div></div>`).join('')}</div>`:'<div class="empty">No seasons loaded</div>'}`;}if(page==='import'){html=`<div class="card"><h3>Import your ESPN league history</h3><p class="sub">League ID <b>143378511</b> is already configured. You can upload ESPN API JSON files for one or multiple seasons. The site combines them into your all-time archive.</p><button class="btn" onclick="document.getElementById('upload').click()">Choose ESPN JSON files</button> <button class="btn secondary" onclick="downloadData()">Export current data</button> <button class="btn secondary" onclick="resetDemo()">Reset demo</button><div class="notice" id="importMessage">Your ESPN login cookies are private credentials. Never paste them into this website or send them in chat.</div><div class="import"><div class="eyebrow">STEP 1 · GET YOUR DATA</div><p>While logged into ESPN, try opening the 2026 API URL below. Save the JSON response as a file. For previous seasons, replace <b>2026</b> with the year. ESPN may require authentication for older years.</p><code id="apiLink">https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026/segments/0/leagues/143378511?view=mTeam&view=mMatchupScore&view=mSettings&view=mStatus</code><p><a target="_blank" rel="noopener" href="https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026/segments/0/leagues/143378511?view=mTeam&view=mMatchupScore&view=mSettings&view=mStatus">Open 2026 ESPN API ↗</a></p><div class="eyebrow">STEP 2 · UPLOAD FILES</div><p>Select all saved JSON files at once. The importer reads season standings, manager names, championships, and completed matchups. It keeps imported data in your browser's local storage.</p><div class="eyebrow">STEP 3 · SHARE WITH FRIENDS</div><p>To publish the same data for everyone, export the combined data and host the website together with that JSON file, or deploy a backend that refreshes league data. Browser-local imports aren't automatically shared with other visitors.</p></div></div>`}document.getElementById('content').innerHTML=html}function allGames(){const r=[];for(const s of data.seasons)for(const g of s.matchups){const a=s.teams.find(t=>t.id===g.homeId),b=s.teams.find(t=>t.id===g.awayId);if(a)r.push({name:a.name,score:g.homeScore,margin:Math.abs(g.homeScore-g.awayScore),year:s.year,week:g.week});if(b)r.push({name:b.name,score:g.awayScore,margin:Math.abs(g.homeScore-g.awayScore),year:s.year,week:g.week})}return r}function setPage(p){page=p;render();window.scrollTo(0,0)}function downloadData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fantasy-hof-league-143378511.json';a.click();URL.revokeObjectURL(a.href)}function resetDemo(){if(confirm('Replace imported data with the fictional demo?')){data=demo;save();render()}}function parseESPN(raw){if(Array.isArray(raw))raw=raw[0];if(raw?.seasons&&Array.isArray(raw.seasons))return raw.seasons;if(!raw?.teams||!Array.isArray(raw.teams))throw Error('Not an ESPN league JSON response: teams[] missing');const year=Number(raw.seasonId||raw.season||raw.year);if(!year)throw Error('Missing seasonId');const members=new Map((raw.members||[]).map(m=>[m.id,[m.firstName,m.lastName].filter(Boolean).join(' ')||m.displayName||'Unknown Manager']));const teams=raw.teams.map(t=>{const r=t.record?.overall||{};const owners=t.owners||[];return {id:t.id,managerId:owners[0]||'team-'+t.id,name:t.name||[t.location,t.nickname].filter(Boolean).join(' ')||'Team '+t.id,manager:owners.map(o=>members.get(o)).filter(Boolean).join(' & ')||'Unknown Manager',rank:Number(t.rankCalculatedFinal||t.playoffSeed||t.rank||0),wins:Number(r.wins||0),losses:Number(r.losses||0),points:Number(r.pointsFor||0)}});const matchups=(raw.schedule||[]).filter(g=>g.home?.teamId&&g.away?.teamId&&Number.isFinite(g.home.totalPoints)&&Number.isFinite(g.away.totalPoints)&&((g.winner&&g.winner!=='UNDECIDED')||g.home.totalPoints>0||g.away.totalPoints>0)).map(g=>({week:g.matchupPeriodId||0,homeId:g.home.teamId,awayId:g.away.teamId,homeScore:g.home.totalPoints,awayScore:g.away.totalPoints}));return [{year,teams,matchups,leagueName:raw.settings?.name}]}document.getElementById('upload').addEventListener('change',async e=>{let count=0,errors=[];let seasons=data.demo?[]:[...data.seasons];for(const f of e.target.files){try{const raw=JSON.parse(await f.text());const incoming=parseESPN(raw);for(const s of incoming){seasons=seasons.filter(x=>x.year!==s.year);seasons.push(s);count++}}catch(err){errors.push(`${f.name}: ${err.message}`)}}if(count){data={demo:false,leagueName:'ESPN League 143378511',seasons:seasons.sort((a,b)=>a.year-b.year)};save()}render();document.getElementById('importMessage').textContent=`Imported ${count} season(s). ${errors.join(' | ')}`;e.target.value=''});render();</script></body></html>
